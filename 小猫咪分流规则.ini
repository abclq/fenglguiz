[custom]
; 王叔叔的小猫咪分流规则 · subconverter 标准格式
; 2026-10-29 修复：原文件用 [General]/[Rules] 假 ini 语法，SUBAPI(subconverter 内核)不认，
; 静默退回默认模板 → 抖音核心域名无直连规则 → 兜底漏网之鱼走日本节点 → 国内抖音卡。
; 本版改用 [custom] + ruleset= 标准语法；规则集全部用 MetaCubeX mrs/list。
; 抖音直连复用 ACL4SSR Douyin.list，无需单独维护

; ===== 基础 =====
enable_rule_generator=true
overwrite_original_rules=true
add_emoji=true
remove_emoji=false
add_classical_rules=false

; ===== DNS（Meta 原生写在 Clash 侧也生效，这里给 subconverter 用）=====
clash_use_new_field_name=true

; ===== 自定义规则（先于一切规则集）=====
; 抖音/字节全家族直连（治"国内抖音绕日本"），直接内联复用本文件
ruleset=🎯 直连,https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/Ruleset/ByteDance.list
; 局域网/私有
ruleset=🎯 直连,https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/LocalAreaNetwork.list
; 劫持/广告
ruleset=🛑 全球拦截,https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/BanAD.list

; ===== 分流规则集 =====
ruleset=🍎 Apple,https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/Ruleset/Apple.list
ruleset=👨🏿‍💻 GitHub,https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/Ruleset/GitHub.list
ruleset=📹 YouTube,https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/Ruleset/YouTube.list
ruleset=🍀 Google,https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/Ruleset/Google.list
ruleset=🪟 Microsoft,https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/Ruleset/Microsoft.list
ruleset=🤖 ChatGPT,https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/Ruleset/OpenAi.list
ruleset=📲 Telegram,https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/Ruleset/Telegram.list
ruleset=🎥 NETFLIX,https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/Ruleset/Netflix.list
ruleset=🎵 TikTok,https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/Ruleset/TikTok.list
ruleset=💶 PayPal,https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/Ruleset/PayPal.list
ruleset=✈️ Speedtest,https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/Ruleset/Speedtest.list

; ===== 国外→代理 / 国内→直连 =====
ruleset=🚀 默认代理,https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/Ruleset/ProxyGFWlist.list
ruleset=🎯 直连,https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/Ruleset/ChinaDomain.list
ruleset=🎯 直连,https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/ChinaIp.list

; ===== 兜底 =====
ruleset=🐟 漏网之鱼,https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/Ruleset/Final.list

; ===== 策略组 =====
custom_proxy_group=🚀 默认代理`select`♻️ 自动选择`🔯 香港故转`🔯 日本故转`🔯 狮城故转`🔯 美国故转`🌍 所有节点
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300
custom_proxy_group=🔯 香港故转`fallback`(港|HK|hk|香港)`http://www.gstatic.com/generate_204`300
custom_proxy_group=🔯 日本故转`fallback`(日|JP|jp|日本)`http://www.gstatic.com/generate_204`300
custom_proxy_group=🔯 狮城故转`fallback`(新|SG|sg|狮城|新加坡)`http://www.gstatic.com/generate_204`300
custom_proxy_group=🔯 美国故转`fallback`(美|US|us|美国)`http://www.gstatic.com/generate_204`300
custom_proxy_group=🌍 所有节点`select`.*
custom_proxy_group=📹 YouTube`select`🚀 默认代理`♻️ 自动选择`.*
custom_proxy_group=🍀 Google`select`🚀 默认代理`♻️ 自动选择`.*
custom_proxy_group=🤖 ChatGPT`select`🚀 默认代理`♻️ 自动选择`.*
custom_proxy_group=👨🏿‍💻 GitHub`select`🚀 默认代理`♻️ 自动选择`.*
custom_proxy_group=🐬 OneDrive`select`🪟 Microsoft`🚀 默认代理`.*
custom_proxy_group=🪟 Microsoft`select`🎯 直连`🚀 默认代理`.*
custom_proxy_group=🎵 TikTok`select`🚀 默认代理`♻️ 自动选择`.*
custom_proxy_group=📲 Telegram`select`🚀 默认代理`♻️ 自动选择`.*
custom_proxy_group=🎥 NETFLIX`select`🚀 默认代理`♻️ 自动选择`.*
custom_proxy_group=💶 PayPal`select`🎯 直连`🚀 默认代理`.*
custom_proxy_group=✈️ Speedtest`select`🎯 直连`🚀 默认代理`.*
custom_proxy_group=🍎 Apple`select`🎯 直连`🚀 默认代理`.*
custom_proxy_group=🎯 直连`select`DIRECT
custom_proxy_group=🛑 全球拦截`select`REJECT`DIRECT
custom_proxy_group=🐟 漏网之鱼`select`🎯 直连`🚀 默认代理`♻️ 自动选择

; ===== 兼容你原 YAML 的 DNS（subconverter 支持 clash dns 覆写有限，主要靠这几行）=====
; 注意：nameserver 故意不放 8.8.8.8/1.1.1.1，防止抖音 CDN 解析到海外 IP（2026-10-11 白屏教训）
dns_nameserver=114.114.114.114,119.29.29.29,223.5.5.5,180.76.76.76
dns_default_nameserver=223.5.5.5,119.29.29.29
